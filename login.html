<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/login_style.css">
  <script src="scripts/login.js" defer></script>
</head>

<body>
  <div class="login-container">

    <div class="login-container-logo">
      <div class="logo-icon"><i class="bi bi-shield-plus"></i></div>
      <h1>MedPortal</h1>
    </div>

    <form>
      <div class="login-container-welcometext">
        <h2>Bienvenido de nuevo</h2>
        <p>Por favor, autentíquese para acceder al portal de proveedores.</p>
      </div>

      <label for="username">Nombre de usuario</label>
      <div class="input-group">
        <i class="bi bi-person-circle input-icon"></i>
        <input type="text" id="username" name="username" placeholder="Ingrese ID de admin" required>
      </div>

      <label for="password">Contraseña</label>
      <div class="input-group">
        <i class="bi bi-lock input-icon"></i>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <button type="submit" class="btn-login">
        Iniciar Sesión <i class="bi bi-box-arrow-in-right"></i>
      </button>
    </form>

    <div class="login-container-securetext">
      <p>
        <i class="bi bi-shield-check"></i>
        <span>Solo Acceso Seguro:</span> Este sistema es para personal medico autorizado. Los intentos de acceso no autorizados son registrados y monitoreados para su cumplimiento.
      </p>
    </div>
  </div>
</body>
</html>
