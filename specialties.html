<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Especialidades</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard_style.css">
  <link rel="stylesheet" href="assets/css/specialties_style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="scripts/specialties-storage.js" defer></script>
  <script src="scripts/specialties.js" defer></script>
</head>
<body>
  <div class="dashboard-container">

    <header>
      <span>Admin Portal</span>
      <button class="menu" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
    </header>

    <nav id="sidebar">
      <div class="brand">
        <strong>Admin Portal</strong>
        <small>Healthcare Management</small>
      </div>

      <ul class="nav-links">
        <li><a href="dashboard.html"><i class="bi bi-grid"></i> Panel</a></li>
        <li class="active"><a href="specialties.html"><i class="bi bi-list"></i> Especialidades</a></li>
      </ul>

      <div class="nav-bottom">
        <a href="#"><i class="bi bi-gear"></i> Configuración</a>
        <button id="logout"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</button>
        <div class="user">
          <span class="avatar">AJ</span>
          <div>
            <strong>Administradora</strong>
            <small>Administradora Jefa</small>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <h1>Directorio de Especialidades</h1>
      <p class="page-subtitle">Administre las categorías médicas y servicios del personal especializado.</p>

      <div class="search-box">
        <i class="bi bi-search"></i>
        <input
          type="search"
          id="search-input"
          placeholder="Buscar especialidad..."
          aria-label="Buscar especialidad por nombre"
          autocomplete="off"
        >
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="specialties-table-body">
            <!-- Las especialidades se cargan dinámicamente desde scripts/specialties.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
